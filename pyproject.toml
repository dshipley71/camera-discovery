[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-discovery"
version = "0.1.0"
description = "Simplified agentic public camera discovery pipeline with deterministic trust gates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Camera Discovery Contributors"}]
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13.7", "python-dotenv>=1.0", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
playwright = ["playwright>=1.44"]
cloakbrowser = ["cloakbrowser>=0.3.29"]
dev = ["pytest>=8.0", "nbformat>=5.9", "ruff>=0.8", "mypy>=1.8"]
notebook = ["jupyter>=1.0", "nbformat>=5.9", "pandas>=2.0"]

[project.scripts]
camera-discovery = "camera_discovery.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
